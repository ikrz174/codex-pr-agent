[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-pr-agent"
version = "0.1.0"
description = "Automated AI-powered Pull Request reviewer and security auditing tool for open-source repositories."
readme = "README.md"
authors = [
  { name = "Namdar Vali", email = "namdar.vali@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Bug Tracking",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["code-review", "ai", "codex", "openai", "github-action", "security-audit", "pull-request"]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/ikrz174/codex-pr-agent"
Repository = "https://github.com/ikrz174/codex-pr-agent"
Issues = "https://github.com/ikrz174/codex-pr-agent/issues"

[project.scripts]
codex-pr-agent = "codex_pr_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
